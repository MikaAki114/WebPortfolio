<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get In Touch - Sophia Varela</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-green: #2a724d;
            --dark-green: #163624;
            --pink-accent: #f7cbd6;
            --bg-color: #fdf3f5;
            --text-dark: #163624;
            --text-light: #2b4735; 
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'DM Sans', sans-serif;
            color: var(--text-dark);
            overflow-x: hidden;
        }

        header {
            width: 100%;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 60px;
            color: var(--dark-green);
            position: relative;
            z-index: 20;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo span {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--pink-accent);
            color: var(--dark-green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: 20px;
        }

        .links {
            display: flex;
            align-items: center;
        }

        .links a {
            color: var(--dark-green);
            text-decoration: none;
            margin-left: 32px;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .links a:hover:not(.btn) {
            color: var(--primary-green);
        }

        .btn {
            background: var(--pink-accent);
            color: var(--dark-green) !important;
            padding: 10px 22px;
            border-radius: 25px;
            font-weight: 700;
            transition: transform 0.2s ease, opacity 0.3s ease;
        }

        .btn:hover {
            opacity: 0.85;
            transform: translateY(-2px);
        }

        .contact-page {
            max-width: 1400px;
            margin: 0 auto;
            padding: 80px 60px 100px 60px;
            display: flex;
            justify-content: space-between;
            gap: 80px;
        }

        .contact-left {
            width: 45%;
        }

        .contact-left h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(45px, 5vw, 75px);
            font-weight: 900;
            line-height: 0.95;
            color: var(--dark-green);
            margin-bottom: 30px;
        }

        .contact-left p {
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-light);
            margin-bottom: 40px;
        }

        .contact-info {
            margin-top: 40px;
            padding-top: 40px;
            border-top: 1px solid rgba(22, 54, 36, 0.12);
        }

        .contact-info p {
            margin-bottom: 15px;
            font-size: 15px;
            color: var(--text-dark);
        }

        .contact-info strong {
            color: var(--dark-green);
            font-weight: 700;
            margin-right: 8px;
        }

        .contact-right {
            width: 50%;
            background: white;
            padding: 50px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(22, 54, 36, 0.04);
        }

        .contact-form {
            width: 100%;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
            color: var(--dark-green);
        }

        .name-row {
            display: flex;
            gap: 20px;
        }

        .name-row div {
            flex: 1;
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid rgba(22, 54, 36, 0.15);
            padding: 16px;
            font-size: 15px;
            font-family: 'DM Sans', sans-serif;
            background: #fafafa;
            border-radius: 12px;
            color: var(--dark-green);
            transition: all 0.3s ease;
        }

        input::placeholder, textarea::placeholder {
            color: rgba(22, 54, 36, 0.4);
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary-green);
            background: white;
            box-shadow: 0 0 0 3px rgba(42, 114, 77, 0.1);
        }

        textarea {
            resize: vertical;
            height: 160px;
        }

        .submit-btn {
            background: var(--dark-green);
            color: white;
            border: none;
            padding: 16px 40px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            font-family: 'DM Sans', sans-serif;
            border-radius: 30px;
            transition: background 0.3s ease, transform 0.2s ease;
            width: 100%;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: var(--primary-green);
            transform: translateY(-2px);
        }

        @media(max-width: 992px) {
            nav {
                padding: 24px 40px; 
            }
            .contact-page {
                flex-direction: column;
                padding: 50px 40px 80px;
                gap: 50px;
            }
            .contact-left,
            .contact-right {
                width: 100%;
            }
        }

        @media(max-width: 600px) {
            nav {
                flex-direction: column;
                gap: 20px;
                padding: 24px 20px;
            }
            .links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
            }
            .links a {
                margin-left: 0;
            }
            .contact-right {
                padding: 30px 20px;
            }
            .name-row {
                flex-direction: column;
                gap: 25px;
            }
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <div class="logo">
                <span>S</span> Sophia Varela
            </div>
            <div class="links">
                <a href="index.html">About Me</a>
                <a href="resume.html">Resume</a>
                <a href="contactme.html" class="btn">Get in Touch!</a>
            </div>
        </nav>
    </header>

    <section class="contact-page">
        <div class="contact-left">
            <h1>
                GET IN<br>
                TOUCH
            </h1>
            <p>
                For general inquiries, collaborations, project discussions,
                or freelance opportunities, feel free to reach out using the
                contact form. I’ll get back to you as soon as possible.
            </p>

            <div class="contact-info">
                <p><strong>T:</strong> +63 933 243 1122</p>
                <p><strong>E:</strong> akishinomika5@gmail.com</p>
            </div>
        </div>

        <div class="contact-right">
            <form class="contact-form">
                <div class="form-group">
                    <label>Name</label>
                    <div class="name-row">
                        <div>
                            <input type="text" placeholder="First Name">
                        </div>
                        <div>
                            <input type="text" placeholder="Last Name">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="you@example.com">
                </div>

                <div class="form-group">
                    <label>Number</label>
                    <input type="tel" placeholder="+63 000 000 0000">
                </div>

                <div class="form-group">
                    <label>Subject</label>
                    <input type="text" placeholder="How can I help you?">
                </div>

                <div class="form-group">
                    <label>Message</label>
                    <textarea placeholder="Write your message here..."></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    Send Message
                </button>
            </form>
        </div>
    </section>

</body>
</html>
