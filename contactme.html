<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get In Touch - Sophia Varela</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-green: #2f8b5d;
            --dark-green: #173722;
            --pink-accent: #f4c8d5;
            --bg-color: #f7f5f5;
            --text-dark: #333333;
            --text-light: #666666;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Poppins', sans-serif;
            color: var(--text-dark);
        }

        /* ==========================
           NAVIGATION 
        ========================== */
        header {
            /* Reduced side padding and removed max-width to push to corners */
            padding: 40px 40px 0; 
            width: 100%;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--dark-green);
            font-size: 32px;
            font-family: 'Cormorant Garamond', serif;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .logo span {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--pink-accent);
            color: var(--dark-green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            font-size: 18px;
            font-weight: 600;
        }

        .links {
            display: flex;
            align-items: center;
        }

        .links a {
            text-decoration: none;
            color: var(--text-dark);
            margin-left: 40px;
            font-weight: 500;
            font-size: 15px;
            transition: color 0.3s ease;
        }

        .links a:hover:not(.btn) {
            color: var(--primary-green);
        }

        .btn {
            background-color: var(--pink-accent);
            color: var(--dark-green) !important;
            padding: 12px 28px;
            border-radius: 30px;
            font-weight: 600;
            transition: transform 0.2s ease, opacity 0.3s ease;
        }

        .btn:hover {
            opacity: 0.85;
            transform: translateY(-2px);
        }

        /* ==========================
           CONTACT PAGE
        ========================== */
        .contact-page {
            max-width: 1300px;
            margin: 0 auto;
            padding: 80px 80px 100px;

            display: flex;
            justify-content: space-between;
            gap: 80px;
        }

        .contact-left {
            width: 40%;
        }

        .contact-left h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 85px;
            font-weight: 500;
            line-height: 0.95;
            color: var(--dark-green);
            margin-bottom: 40px;
        }

        .contact-left p {
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-light);
            margin-bottom: 40px;
        }

        .contact-info {
            margin-top: 40px;
            padding-top: 40px;
            border-top: 1px solid #e0e0e0;
        }

        .contact-info p {
            margin-bottom: 15px;
            font-size: 16px;
            color: var(--text-dark);
        }

        .contact-info strong {
            color: var(--dark-green);
            font-weight: 600;
            margin-right: 8px;
        }

        /* ==========================
           FORM
        ========================== */
        .contact-right {
            width: 60%;
            background: white;
            padding: 50px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.03);
        }

        .contact-form {
            width: 100%;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-dark);
        }

        .name-row {
            display: flex;
            gap: 20px;
        }

        .name-row div {
            flex: 1;
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid #e0e0e0;
            padding: 16px;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            background: #fafafa;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary-green);
            background: white;
            box-shadow: 0 0 0 3px rgba(47, 139, 93, 0.1);
        }

        textarea {
            resize: vertical;
            height: 160px;
        }

        .submit-btn {
            background: var(--dark-green);
            color: white;
            border: none;
            padding: 16px 40px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            border-radius: 8px;
            transition: background 0.3s ease, transform 0.2s ease;
            width: 100%;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: var(--primary-green);
            transform: translateY(-2px);
        }

        /* ==========================
           RESPONSIVE
        ========================== */
        @media(max-width: 992px) {
            header {
                padding: 30px 30px 0; /* Adjusted for mobile */
            }
            .contact-page {
                flex-direction: column;
                padding: 50px 40px 80px;
                gap: 50px;
            }
            .contact-left,
            .contact-right {
                width: 100%;
            }
            .contact-left h1 {
                font-size: 65px;
                margin-bottom: 30px;
            }
        }

        @media(max-width: 600px) {
            nav {
                flex-direction: column;
                gap: 20px;
            }
            .links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
            }
            .links a {
                margin-left: 0;
            }
            .contact-right {
                padding: 30px 20px;
            }
            .name-row {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <div class="logo">
                <span>S</span> Sophia Varela
            </div>
            <div class="links">
                <a href="index.html">About Me</a>
                <a href="resume.html">Resume</a>
                <a href="contactme.html" class="btn">Get in Touch!</a>
            </div>
        </nav>
    </header>

    <section class="contact-page">
        <div class="contact-left">
            <h1>
                GET IN<br>
                TOUCH
            </h1>
            <p>
                For general inquiries, collaborations, project discussions,
                or freelance opportunities, feel free to reach out using the
                contact form. I’ll get back to you as soon as possible.
            </p>

            <div class="contact-info">
                <p><strong>T:</strong> +63 933 243 1122</p>
                <p><strong>E:</strong> akishinomika5@gmail.com</p>
            </div>
        </div>

        <div class="contact-right">
            <form class="contact-form">
                <div class="form-group">
                    <label>Name</label>
                    <div class="name-row">
                        <div>
                            <input type="text" placeholder="First Name">
                        </div>
                        <div>
                            <input type="text" placeholder="Last Name">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="you@example.com">
                </div>

                <div class="form-group">
                    <label>Number</label>
                    <input type="tel" placeholder="+63 000 000 0000">
                </div>

                <div class="form-group">
                    <label>Subject</label>
                    <input type="text" placeholder="How can I help you?">
                </div>

                <div class="form-group">
                    <label>Message</label>
                    <textarea placeholder="Write your message here..."></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    Send Message
                </button>
            </form>
        </div>
    </section>

</body>
</html>
